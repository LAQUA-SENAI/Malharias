<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Escolha uma malharia para falar pelo WhatsApp.">
<title>Malharias - Contatos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #f4f7fb, #e8eef7);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    color: #172033;
  }
  .container {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.10);
    text-align: center;
  }
  .logo {
    width: 76px;
    height: 76px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: #eef2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .subtitle { margin: 0 0 26px; color: #687386; font-size: 16px; }
  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    margin: 12px 0;
    border: 1px solid #e5e9ef;
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,.08);
  }
  .icon {
    width: 48px;
    height: 48px;
    flex: 0 0 48px;
    border-radius: 12px;
    background: #25D366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
  }
  .info { text-align: left; flex: 1; }
  .name { font-weight: 700; font-size: 17px; margin-bottom: 4px; }
  .action { color: #25a95a; font-size: 14px; }
  .arrow { font-size: 24px; color: #9aa5b4; }
  footer { margin-top: 22px; color: #9aa5b4; font-size: 12px; }
</style>
</head>
<body>
  <main class="container">
    <div class="logo">🧵</div>
    <h1>Escolha uma malharia</h1>
    <p class="subtitle">Toque em uma das opções para conversar pelo WhatsApp.</p>

    <a class="card" href="https://wa.me/5598985052486" target="_blank" rel="noopener">
      <div class="icon">◉</div>
      <div class="info">
        <div class="name">Malharia Assad</div>
        <div class="action">Conversar no WhatsApp</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card" href="https://wa.me/5598981148907" target="_blank" rel="noopener">
      <div class="icon">◉</div>
      <div class="info">
        <div class="name">Malharia Milagres</div>
        <div class="action">Conversar no WhatsApp</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card" href="https://wa.me/5598988554396" target="_blank" rel="noopener">
      <div class="icon">◉</div>
      <div class="info">
        <div class="name">Malharia 3K</div>
        <div class="action">Conversar no WhatsApp</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <footer>Selecione o contato desejado</footer>
  </main>
</body>
</html>
